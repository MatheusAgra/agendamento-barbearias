name: Reference policy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-references-in-main:
    name: No references in main
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed files
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify destination policy
        run: node scripts/check-reference-policy.mjs --branch main --ref HEAD
